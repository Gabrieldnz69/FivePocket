<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FivePocket Builder</title>
<link rel="stylesheet" href="launcher.css">
<link rel="icon" href="fivepocket-mark.svg">
</head>
<body class="tab-build">
<!-- The window, laid out 1:1 on the maintainer's screenshots of a desktop game launcher (measures in launcher.css): the
     home page on his 1288 x 600 capture, the settings pages and the dialogs on his settings / error / installation
     captures. Ours: the FivePocket mark and wordmark, BUILD, the backdrops (LA photos chosen by the maintainer), the links,
     every text. No picture, logo or font of the launcher's publisher is used. -->
<div id="backdrop"></div>

<aside id="side">
  <img id="side-mark" src="fivepocket-mark.svg" alt="FivePocket">
  <div id="side-version"></div>
  <!-- the home page's lists -->
  <div id="home-lists">
    <h2 class="side-head" id="head-discs">My discs</h2>
    <div id="disc-list"></div>
    <h2 class="side-head" id="head-editions">Editions</h2>
    <div id="edition-list"></div>
  </div>
  <!-- the other pages' section list (the launcher's "Launcher settings" column) -->
  <div id="section-list"><h2 id="section-head"></h2><div id="sections"></div></div>
  <div id="side-rule"></div>
  <svg id="side-more" viewBox="0 0 14 8" width="14" height="8"><path d="M1 1l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  <div id="side-links">
    <a class="link" data-link="discord" title="Discord">
      <svg viewBox="0 0 28 22" width="28" height="22"><path fill="currentColor" d="M23.7 1.9A22.6 22.6 0 0 0 18.1.2l-.7 1.5a21 21 0 0 0-6.8 0L9.9.2a22.5 22.5 0 0 0-5.6 1.7C.8 7.2-.2 12.3.3 17.4a22.8 22.8 0 0 0 6.9 3.5l1.5-2.4a14.7 14.7 0 0 1-2.3-1.1l.6-.4a16.3 16.3 0 0 0 14 0l.6.4c-.7.4-1.5.8-2.3 1.1l1.5 2.4a22.7 22.7 0 0 0 6.9-3.5c.6-5.9-1-11-4-15.5zM9.4 14.3c-1.4 0-2.5-1.3-2.5-2.8s1.1-2.8 2.5-2.8 2.5 1.3 2.5 2.8-1.1 2.8-2.5 2.8zm9.2 0c-1.4 0-2.5-1.3-2.5-2.8s1.1-2.8 2.5-2.8 2.5 1.3 2.5 2.8-1.1 2.8-2.5 2.8z"/></svg>
    </a>
    <a class="link" data-link="x" title="X">
      <svg viewBox="0 0 24 22" width="24" height="22"><path fill="currentColor" d="M18.2 0h3.5l-7.6 8.7L23 22h-7l-5.5-7.2L4.2 22H.7l8.1-9.3L.3 0h7.2l5 6.6L18.2 0zm-1.2 19.8h1.9L6.4 2.1H4.3l12.7 17.7z"/></svg>
    </a>
    <a class="link" data-link="github" title="GitHub">
      <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.1c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3z"/></svg>
    </a>
  </div>
</aside>

<nav id="nav">
  <a data-tab="build">BUILD</a><a data-tab="progress">PROGRESS</a><a data-tab="results">RESULTS</a><a data-tab="settings">SETTINGS</a>
</nav>
<div id="avatar"><img src="fivepocket-mark.svg" alt=""></div>
<div id="chrome" hidden>
  <a data-chrome="minimise"><svg viewBox="0 0 12 2" width="12" height="2"><rect width="12" height="2" fill="currentColor"/></svg></a>
  <a data-chrome="maximise"><svg viewBox="0 0 13 14" width="13" height="14"><rect x="1" y="1" width="11" height="12" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></a>
  <a data-chrome="close"><svg viewBox="0 0 11 10" width="11" height="10"><path d="M1 0l9 10M10 0L1 10" stroke="currentColor" stroke-width="1.6"/></svg></a>
</div>

<main id="page-build" class="page">
  <!-- the FivePocket name stacked in the box the launcher's game logo takes (335..560 x 165..365): FIVE / POCKET /
       the edition being built, in our own block lettering (lettering.js), white with a black rim -->
  <svg id="wordmark" viewBox="0 0 225 200" width="225" height="200" aria-label="FivePocket">
    <defs>
      <filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity=".45"/></filter>
    </defs>
    <g filter="url(#lift)"><g id="stack"></g></g>
  </svg>
  <img id="logo-file" alt="" hidden>
  <button id="primary" type="button"><img id="primary-art" alt="" hidden><span id="primary-label">BUILD</span></button>
  <p id="primary-note"></p>
</main>

<!-- the other pages: the launcher's settings page (rows of a title, a grey line and a control at the right) -->
<main id="page-rows" class="page" hidden><div id="rows"></div><pre id="log" hidden></pre></main>

<div id="detail" hidden></div>

<!-- dialogs: the build dialog on the installation dialog, the error dialog on the error dialog -->
<div id="veil" hidden></div>
<section id="build-dialog" class="dialog" hidden>
  <div id="build-art"><img src="fivepocket-mark.svg" alt=""></div>
  <div id="build-body">
    <h1>Build</h1>
    <p id="build-sub"></p>
    <div id="build-path"><div class="select"><span id="build-out"></span><svg viewBox="0 0 12 7" width="12" height="7"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></div>
      <button class="pill" type="button" id="build-browse">BROWSE</button></div>
    <p id="build-space"></p>
    <div id="build-options"></div>
    <p id="build-problem"></p>
    <div id="build-buttons"><button class="pill" type="button" id="build-cancel">CANCEL</button><button class="pill accent" type="button" id="build-go">BUILD</button></div>
  </div>
</section>
<section id="error-dialog" class="dialog" hidden>
  <a class="x" id="error-x"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.6"/></svg></a>
  <h1 id="error-title">Error</h1>
  <p id="error-text"></p>
  <button class="pill" type="button" id="error-ok">OK</button>
</section>
<script src="lettering.js"></script>
<script src="launcher.js"></script>
</body>
</html>
